services:
  mysql:
    image: mysql:8.0
    container_name: pcforge_mysql
    restart: unless-stopped
    environment:
      # MYSQL_USER/MYSQL_PASSWORD servem para criar um usuario comum e a
      # imagem recusa "root" neles ("cannot be used for the root user"),
      # entrando em restart loop. O backend conecta como root, entao a conta
      # vem so de MYSQL_ROOT_PASSWORD.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pcforge_redis
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  notificacoes-db:
    image: mysql:8.0
    container_name: pcforge_notificacoes_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTIFICATIONS_DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${NOTIFICATIONS_DB_NAME:-pcforge_notificacoes}
    volumes:
      - notificacoes_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${NOTIFICATIONS_DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./TechAcademy5back
      dockerfile: Dockerfile
    container_name: pcforge_backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LEGACY_IMAGES_DIR: /app/catalogo-imagens
      REDIS_URL: ${REDIS_URL}
    # Removida na SCRUM-42, quando o mobile passar a usar o gateway Nginx.
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./TechAcademy5back/uploads:/app/uploads
      - ./TechAcademy5front/public/imagens/produtos:/app/catalogo-imagens:ro

  notifications:
    build:
      context: ./TechAcademy5notifications
      dockerfile: Dockerfile
    container_name: pcforge_notifications
    restart: unless-stopped
    environment:
      DB_HOST: notificacoes-db
      DB_PORT: 3306
      DB_NAME: ${NOTIFICATIONS_DB_NAME:-pcforge_notificacoes}
      DB_USER: root
      DB_PASSWORD: ${NOTIFICATIONS_DB_ROOT_PASSWORD:-rootpassword}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      notificacoes-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./TechAcademy5front
      dockerfile: Dockerfile
    container_name: pcforge_frontend
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - REACT_APP_API_URL=
      - REACT_APP_EMAILJS_SERVICE_ID=${REACT_APP_EMAILJS_SERVICE_ID}
      - REACT_APP_EMAILJS_TEMPLATE_ID=${REACT_APP_EMAILJS_TEMPLATE_ID}
      - REACT_APP_EMAILJS_PUBLIC_KEY=${REACT_APP_EMAILJS_PUBLIC_KEY}
    volumes:
      - ./TechAcademy5front/public/imagens:/app/public/imagens:ro
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: pcforge_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
  notificacoes_data:

networks:
  app-network:
    driver: bridge
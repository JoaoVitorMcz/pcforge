name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

  # Gatilho manual. O repositorio nasceu de um push --mirror e o GitHub nunca
  # processou os eventos automaticos; isso permite disparar o pipeline a mao.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./TechAcademy5back
          - service: frontend
            context: ./TechAcademy5front
          - service: notifications
            context: ./TechAcademy5notifications
          - service: payments
            context: ./TechAcademy5payments
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: TechAcademy5back
        run: npm ci
        env:
          HUSKY: '0'

      - name: Run backend tests
        working-directory: TechAcademy5back
        run: npm test -- --runInBand

  notifications-tests:
    name: Notifications Service
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: TechAcademy5notifications/package-lock.json

      - name: Install notifications dependencies
        working-directory: TechAcademy5notifications
        run: npm ci

      - name: Build notifications service
        working-directory: TechAcademy5notifications
        run: npm run build

      - name: Lint notifications service
        working-directory: TechAcademy5notifications
        run: npm run lint

      - name: Run notifications tests
        working-directory: TechAcademy5notifications
        run: npm test

  payments-tests:
    name: Payments Service
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: TechAcademy5payments/package-lock.json

      - name: Install payments dependencies
        working-directory: TechAcademy5payments
        run: npm ci

      - name: Build payments service
        working-directory: TechAcademy5payments
        run: npm run build

      - name: Lint payments service
        working-directory: TechAcademy5payments
        run: npm run lint

      - name: Run payments tests
        working-directory: TechAcademy5payments
        run: npm test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: TechAcademy5front
        run: npm ci

      - name: Run frontend tests
        working-directory: TechAcademy5front
        run: npm test -- --watchAll=false --passWithNoTests

  e2e-tests:
    name: E2E Tests (Playwright)
    # Fixado em 24.04 de proposito. Em 03/11/2026 o ubuntu-latest passou a ser
    # o Ubuntu 26.04, e o Playwright 1.60 recusa instalar os browsers nele:
    # "Playwright does not support chromium on ubuntu26.04-x64". Os outros jobs
    # nao instalam browser e seguem no ubuntu-latest sem problema.
    # Para voltar ao ubuntu-latest, primeiro suba a versao do @playwright/test.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frontend dependencies
        working-directory: TechAcademy5front
        run: npm ci

      - name: Install Playwright browsers
        working-directory: TechAcademy5front
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        working-directory: TechAcademy5front
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: TechAcademy5front/playwright-report/
          retention-days: 7

  mobile-checks:
    name: Mobile Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install mobile dependencies
        working-directory: TechAcademy5mobile
        run: npm ci

      - name: Typecheck
        working-directory: TechAcademy5mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: TechAcademy5mobile
        run: npm run lint

      - name: Mobile Tests
        working-directory: TechAcademy5mobile
        run: npm test

  deploy-images:
    name: Deploy images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-images
      - backend-tests
      - notifications-tests
      - payments-tests
      - frontend-tests
      - e2e-tests
      - mobile-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./TechAcademy5back
          - service: frontend
            context: ./TechAcademy5front
          - service: notifications
            context: ./TechAcademy5notifications
          - service: payments
            context: ./TechAcademy5payments
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release image tag
        id: release
        shell: bash
        run: |
          release_version="$(git for-each-ref --merged="$GITHUB_SHA" --sort=-version:refname --format='%(refname:short)' refs/tags \
            | awk '/^v([2-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -z "$release_version" ]]; then
            echo "::error::No v2.0.0-or-newer release tag is reachable from this main commit."
            exit 1
          fi

          repository="${GITHUB_REPOSITORY,,}"
          image_tag="${release_version}-${GITHUB_SHA::12}"
          echo "image_prefix=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing images as ${image_tag}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.release.outputs.image_prefix }}-${{ matrix.service }}:${{ steps.release.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Rastreabilidade entre o card do Jira e o codigo: e o SCRUM-<n> no nome da
  # branch que faz a branch aparecer no painel de desenvolvimento do card.
  # Avisa sem reprovar de proposito: correcao urgente de infraestrutura pode
  # nao ter card, como o fix que destravou o Actions neste repositorio.
  branch-tag:
    name: ID do card na branch
    runs-on: ubuntu-latest
    # So em PR: a dev e a main nunca tem ID e avisariam a cada push.
    if: github.event_name == 'pull_request'
    steps:
      - name: Conferir o ID do card
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if echo "$BRANCH" | grep -qE 'SCRUM-[0-9]+'; then
            CARD=$(echo "$BRANCH" | grep -oE 'SCRUM-[0-9]+' | head -1)
            echo "✅ Branch \`$BRANCH\` ligada ao card **$CARD**." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ A branch \`$BRANCH\` não tem o ID do card." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Sem o \`SCRUM-<n>\` no nome, a branch não aparece no painel de desenvolvimento do card e o trabalho fica sem rastro até o requisito. Convenção: \`feature/SCRUM-<n>-descricao-curta\` (docs/gestao/fluxo-de-trabalho.md)." >> $GITHUB_STEP_SUMMARY
            echo "::warning::Branch '$BRANCH' sem o ID do card (SCRUM-<n>)."
          fi

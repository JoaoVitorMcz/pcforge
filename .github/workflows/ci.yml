name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

  # Gatilho manual. O repositorio nasceu de um push --mirror e o GitHub nunca
  # processou os eventos automaticos; isso permite disparar o pipeline a mao.
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: TechAcademy5back
        run: npm ci
        env:
          HUSKY: '0'

      - name: Run backend tests
        working-directory: TechAcademy5back
        run: npm test -- --runInBand

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: TechAcademy5front
        run: npm ci

      - name: Run frontend tests
        working-directory: TechAcademy5front
        run: npm test -- --watchAll=false --passWithNoTests

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frontend dependencies
        working-directory: TechAcademy5front
        run: npm ci

      - name: Install Playwright browsers
        working-directory: TechAcademy5front
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        working-directory: TechAcademy5front
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: TechAcademy5front/playwright-report/
          retention-days: 7

  mobile-checks:
    name: Mobile Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install mobile dependencies
        working-directory: TechAcademy5mobile
        run: npm ci

      - name: Typecheck
        working-directory: TechAcademy5mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: TechAcademy5mobile
        run: npm run lint

      - name: Mobile Tests
        working-directory: TechAcademy5mobile
        run: npm test

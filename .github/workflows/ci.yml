name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

  # Gatilho manual. O repositorio nasceu de um push --mirror e o GitHub nunca
  # processou os eventos automaticos; isso permite disparar o pipeline a mao.
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: TechAcademy5back
        run: npm ci
        env:
          HUSKY: '0'

      - name: Run backend tests
        working-directory: TechAcademy5back
        run: npm test -- --runInBand

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: TechAcademy5front
        run: npm ci

      - name: Run frontend tests
        working-directory: TechAcademy5front
        run: npm test -- --watchAll=false --passWithNoTests

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frontend dependencies
        working-directory: TechAcademy5front
        run: npm ci

      - name: Install Playwright browsers
        working-directory: TechAcademy5front
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        working-directory: TechAcademy5front
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: TechAcademy5front/playwright-report/
          retention-days: 7

  mobile-checks:
    name: Mobile Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install mobile dependencies
        working-directory: TechAcademy5mobile
        run: npm ci

      - name: Typecheck
        working-directory: TechAcademy5mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: TechAcademy5mobile
        run: npm run lint

      - name: Mobile Tests
        working-directory: TechAcademy5mobile
        run: npm test

  # Rastreabilidade entre o card do Jira e o codigo: e o SCRUM-<n> no nome da
  # branch que faz a branch aparecer no painel de desenvolvimento do card.
  # Avisa sem reprovar de proposito: correcao urgente de infraestrutura pode
  # nao ter card, como o fix que destravou o Actions neste repositorio.
  branch-tag:
    name: ID do card na branch
    runs-on: ubuntu-latest
    # So em PR: a dev e a main nunca tem ID e avisariam a cada push.
    if: github.event_name == 'pull_request'
    steps:
      - name: Conferir o ID do card
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if echo "$BRANCH" | grep -qE 'SCRUM-[0-9]+'; then
            CARD=$(echo "$BRANCH" | grep -oE 'SCRUM-[0-9]+' | head -1)
            echo "✅ Branch \`$BRANCH\` ligada ao card **$CARD**." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ A branch \`$BRANCH\` não tem o ID do card." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Sem o \`SCRUM-<n>\` no nome, a branch não aparece no painel de desenvolvimento do card e o trabalho fica sem rastro até o requisito. Convenção: \`feature/SCRUM-<n>-descricao-curta\` (docs/gestao/fluxo-de-trabalho.md)." >> $GITHUB_STEP_SUMMARY
            echo "::warning::Branch '$BRANCH' sem o ID do card (SCRUM-<n>)."
          fi
